name: Numix CI/CD (Android)

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  quality_and_tests:
    name: Code Quality & Testing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Linter (Security & Code Quality)
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Engram Memory Health Check
        run: |
          if command -v engram &> /dev/null; then
            engram doctor --project numix || echo "Engram not configured, skipping"
          else
            echo "Engram CLI not installed, skipping memory health check"
          fi

      - name: Run Unit Tests (Math Engine Coverage)
        run: flutter test --coverage

  android_build_validation:
    name: Android Dry-Run Build
    needs: quality_and_tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Android APK (Debug/Validation)
        # We build debug to validate the code compiles without needing release keystores
        run: flutter build apk --debug
